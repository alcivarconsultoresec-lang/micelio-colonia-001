name: Ejecutar espora

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: micelio-espora-main
  cancel-in-progress: false

jobs:
  run-espora:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run espora with GitHub Models
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MICELIO_MODEL: openai/gpt-4o-mini
          MICELIO_MAX_TOKENS: '500'
        run: |
          python runner/espora_runner.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/resultados.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Resultado de ejecución IA"
            git push
          fi
